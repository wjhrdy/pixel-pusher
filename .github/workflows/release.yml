name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: pixel-pusher
            gui_executable: pixel-pusher-gui
          - os: macos-latest
            target: x86_64-apple-darwin
            executable: pixel-pusher
            gui_executable: pixel-pusher-gui
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: pixel-pusher
            gui_executable: pixel-pusher-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: pixel-pusher.exe
            gui_executable: pixel-pusher-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          archive="pixel-pusher-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.executable }}" "${{ matrix.gui_executable }}" \
            -C "$GITHUB_WORKSPACE" THIRD_PARTY_NOTICES.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pixel-pusher-${{ matrix.target }}
          path: |
            pixel-pusher-*.tar.gz
            pixel-pusher-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pixel-pusher-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
