[package]
name = "pixel-pusher"
version = "0.0.1"
edition = "2024"
description = "Recover a clean logical pixel grid and palette from imperfect pixel art"
repository = "https://github.com/wjhrdy/pixel-pusher"
readme = "README.md"
keywords = ["pixel-art", "image-processing", "palette", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
